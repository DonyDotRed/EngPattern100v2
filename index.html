<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10264f"><meta name="color-scheme" content="light dark"><meta name="description" content="영어회화 패턴 200개를 학습하는 모바일 PWA"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><title>English Pattern Lab V2</title></head><body>
<noscript><div style="padding:24px">JavaScript가 필요합니다.</div></noscript>
<section id="auth" class="auth"><div class="auth-card"><div class="logo">V2</div><p class="eyebrow">PRIVATE STUDY SPACE</p><h1>English Pattern Lab</h1><p>기존 패턴영어 100 + 추가 기초패턴 100, 총 200개 패턴을 모바일에서 반복 학습합니다.</p><form id="authForm"><div class="pwrow"><input id="pw" type="password" autocomplete="current-password" placeholder="Access password" required><button class="icon" id="pwToggle" type="button">보기</button></div><label class="check"><input id="remember" type="checkbox" checked> 이 기기에서 7일간 기억</label><button class="btn primary" style="width:100%;margin-top:8px">학습 공간 열기</button><p id="authMsg" class="tiny" style="color:var(--bad);min-height:1.2em"></p></form><p class="security">GitHub Pages의 클라이언트 비밀번호는 간단한 사용자 확인용입니다. 정적 사이트이므로 강한 보안 인증으로 간주할 수 없습니다.</p></div></section>
<div id="shell" class="shell hide"><header class="topbar"><div class="brand"><button class="logo" data-nav="home" style="border:0">V2</button><div><strong>English Pattern Lab</strong><small id="subtitle">200 lessons · 2 courses</small></div></div><div class="topactions"><button id="install" class="btn ghost wide hide">앱 설치</button><button id="randomBtn" class="icon" title="랜덤 학습">⤨</button><button id="settingsBtn" class="icon" title="설정">⚙</button></div></header>
<main id="main" class="main"><section class="view active" data-view="home" id="home"></section><section class="view" data-view="learn" id="learn"></section><section class="view" data-view="cards" id="cards"></section><section class="view" data-view="quiz" id="quiz"></section><section class="view" data-view="library" id="library"></section><section class="view" data-view="stats" id="stats"></section></main>
<nav class="bottom"><button data-nav="home" class="active"><b>⌂</b><small>홈</small></button><button data-nav="learn"><b>▤</b><small>학습</small></button><button data-nav="cards"><b>◫</b><small>카드</small></button><button data-nav="quiz"><b>✓</b><small>퀴즈</small></button><button data-nav="library"><b>⌕</b><small>표현</small></button></nav></div>
<dialog id="settings" class="dialog"><div class="dialog-head"><div><p class="eyebrow">PREFERENCES</p><b>학습 설정</b></div><button class="icon" onclick="this.closest('dialog').close()">✕</button></div><div id="settingsBody" class="dialog-body"></div></dialog>
<dialog id="speech" class="dialog"><div class="dialog-head"><div><p class="eyebrow">SPEAKING PRACTICE</p><b>말하기 연습</b></div><button class="icon" onclick="this.closest('dialog').close()">✕</button></div><div id="speechBody" class="dialog-body"></div></dialog>
<div id="toast" class="toast"></div><input id="importFile" type="file" accept="application/json" class="hide">
<script src="data.js"></script><script src="app.js"></script></body></html>
