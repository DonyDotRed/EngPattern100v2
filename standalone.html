<section id="auth" class="auth"><div class="auth-card"><div class="logo">V2</div><p class="eyebrow">PRIVATE STUDY SPACE</p><h1>English Pattern Lab</h1><p>기존 패턴영어 100 + 추가 기초패턴 100, 총 200개 패턴을 모바일에서 반복 학습합니다.</p><form id="authForm"><div class="pwrow"><input id="pw" type="password" autocomplete="current-password" placeholder="Access password" required><button class="icon" id="pwToggle" type="button">보기</button></div><label class="check"><input id="remember" type="checkbox" checked> 이 기기에서 7일간 기억</label><button class="btn primary" style="width:100%;margin-top:8px">학습 공간 열기</button><p id="authMsg" class="tiny" style="color:var(--bad);min-height:1.2em"></p></form><p class="security">GitHub Pages의 클라이언트 비밀번호는 간단한 사용자 확인용입니다. 정적 사이트이므로 강한 보안 인증으로 간주할 수 없습니다.</p></div></section>

function answerType(l){if(quiz.answered)return;quiz.answered=true;const a=$('#typeAns').value,score=similarity(l.title,a),ok=score>=88;if(ok)quiz.score++;$('#qfb').innerHTML=`<div class="example" style="margin-top:12px"><div><b>${ok?'정답':'확인해 보세요'} · ${score}%</b><p>${esc(l.title)}</p></div></div>`;nextQuiz()}
function renderLibrary(){let q=norm(libQ),a=DATA.library.filter(x=>(libSource==='all'||x.source===libSource)&&(!q||norm(x.en+' '+x.ko).includes(q))),pageSize=50,pages=Math.max(1,Math.ceil(a.length/pageSize));libPage=Math.min(libPage,pages);let rows=a.slice((libPage-1)*pageSize,libPage*pageSize);const sources=[...new Set(DATA.library.map(x=>x.source))];$('#library').innerHTML=`<div class="toolbar"><div class="search">⌕ <input id="libQ" placeholder="영어·한글 표현 검색" value="${esc(libQ)}"></div><select id="libSource"><option value="all">전체 자료</option>${sources.map(s=>`<option ${libSource===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="section-head"><div><h2>전체 표현 사전</h2><p>${a.length.toLocaleString()}개 검색 결과 · 반복 제거 인덱스</p></div></div><div class="library-list">${rows.map(x=>`<div class="expr-card"><div><b>${esc(x.en)}</b><p>${esc(x.ko||'대본 내 독립 표현')}</p><span class="source">${esc(x.source)} · line ${x.line||'-'}</span></div><button class="icon" data-speak="${esc(x.en)}">🔊</button></div>`).join('')}</div><div class="pager"><button class="btn" id="prevPage">이전</button><span class="tiny muted">${libPage}/${pages}</span><button class="btn" id="nextPage">다음</button></div>`;$('#libQ').oninput=e=>{libQ=e.target.value;libPage=1;renderLibrary()};$('#libSource').onchange=e=>{libSource=e.target.value;libPage=1;renderLibrary()};$('#prevPage').onclick=()=>{libPage=Math.max(1,libPage-1);renderLibrary()};$('#nextPage').onclick=()=>{libPage=Math.min(pages,libPage+1);renderLibrary()};bindSpeak()}
function renderStats(){const m=statusCount('all','mastered'),l=statusCount('all','learning'),n=200-m-l,f=LESSONS.filter(x=>st(x.id).favorite).length;$('#stats').innerHTML=`<div class="section-head"><div><h2>학습 통계</h2><p>현재 브라우저의 로컬 진도입니다.</p></div></div><div class="stats-grid"><div class="panel stat"><strong>${m}</strong><span>완료</span></div><div class="panel stat"><strong>${l}</strong><span>학습 중</span></div><div class="panel stat"><strong>${dueCount()}</strong><span>복습 예정</span></div><div class="panel stat"><strong>${f}</strong><span>즐겨찾기</span></div></div><div class="section-head"><div><h2>코스별 완료율</h2></div></div><div class="panel" style="padding:18px">${COURSES.map(c=>`<div class="barrow"><span>${c.title}</span><div class="progress"><i style="width:${courseProgress(c.id)}%"></i></div><b>${courseProgress(c.id)}%</b></div>`).join('')}</div><div class="section-head"><div><h2>데이터 구성</h2></div></div><div class="panel" style="padding:18px"><div class="barrow"><span>총 패턴</span><div></div><b>200</b></div><div class="barrow"><span>검색 표현</span><div></div><b>${DATA.stats.expressionCount}</b></div><div class="barrow"><span>기존 대본</span><div></div><b>100</b></div><div class="barrow"><span>추가 대본</span><div></div><b>100</b></div></div>`}
function renderSettings(){const b=$('#settingsBody');b.innerHTML=`<div class="setting"><div><label>테마</label><small>화면 색상</small></div><select id="theme"><option value="system">시스템</option><option value="light">라이트</option><option value="dark">다크</option></select></div><div class="setting"><div><label>글자 크기</label><small>모바일 가독성</small></div><input id="font" type="range" min=".9" max="1.25" step=".05" value="${settings.fontScale}"></div><div class="setting"><div><label>TTS 속도</label><small>영어 듣기</small></div><input id="rate" type="range" min=".6" max="1.2" step=".05" value="${settings.ttsRate}"></div><div class="setting"><div><label>퀴즈 문항</label></div><input id="qsize" type="number" min="5" max="50" value="${settings.quizSize}"></div><div class="setting"><div><label>대본 문맥 숨기기</label><small>영어만 집중해서 보기</small></div><input id="hideContext" type="checkbox" ${settings.hideContext?'checked':''}></div><div><button class="btn" id="exportBtn">진도 내보내기</button> <button class="btn" id="importBtn">진도 가져오기</button> <button class="btn bad" id="lockBtn">잠금</button></div><p class="tiny muted">V2는 기존 V1의 <code>p100.progress.v3</code> 진도를 처음 실행할 때 자동으로 기존 100패턴에 연결합니다.</p>`;
 $('#theme').value=settings.theme;$('#theme').onchange=e=>{settings.theme=e.target.value;save(KEY.s,settings);applyTheme()};$('#font').oninput=e=>{settings.fontScale=+e.target.value;save(KEY.s,settings);applyTheme()};$('#rate').oninput=e=>{settings.ttsRate=+e.target.value;save(KEY.s,settings)};$('#qsize').onchange=e=>{settings.quizSize=Math.max(5,Math.min(50,+e.target.value||10));save(KEY.s,settings)};$('#hideContext').onchange=e=>{settings.hideContext=e.target.checked;save(KEY.s,settings)};$('#exportBtn').onclick=exportProgress;$('#importBtn').onclick=()=>$('#importFile').click();$('#lockBtn').onclick=()=>{localStorage.removeItem(KEY.a);sessionStorage.removeItem(KEY.a);location.reload()};$('#importFile').onchange=importProgress}
function exportProgress(){const blob=new Blob([JSON.stringify({version:2,settings,progress},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='english-pattern-lab-v2-progress.json';a.click();URL.revokeObjectURL(a.href)}
function importProgress(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.progress)progress=x.progress;if(x.settings)settings=Object.assign(settings,x.settings);commit();save(KEY.s,settings);applyTheme();toast('진도를 가져왔습니다');renderSettings()}catch{toast('올바른 진도 파일이 아닙니다')}};r.readAsText(f)}
</script></body></html>
